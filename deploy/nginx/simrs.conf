# SIMRS Rawat Jalan - konfigurasi Nginx produksi
# Author: Mochamad Mutaqin Kurniawan <mochmutaqin@gmail.com>
#
# Dipasang otomatis oleh deploy/setup-server.sh ke /etc/nginx/sites-available/simrs.
# Placeholder __DOMAIN__, __APP_DIR__, __PHP_SOCK__ diganti saat instalasi.
#
#   /          -> frontend React hasil build (frontend/dist)
#   /api/      -> backend Yii2 lewat PHP-FPM
#   /node/     -> services-node di 127.0.0.1:3001 (prefix /node dibuang)
#   /internal/ -> TIDAK dibuka ke publik; hanya lewat server lokal 127.0.0.1:8080 di bawah

server {
    listen 80;
    # listen [::]:80;   # aktifkan bila server punya IPv6
    server_name __DOMAIN__;

    root __APP_DIR__/frontend/dist;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # aset hasil build punya hash di nama file, aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # rute React (mis. /kasir/12, /laporan) dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # backend Yii2: semua request /api/* ke web/index.php
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __APP_DIR__/backend-yii/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 60s;
    }

    # endpoint antar-service tidak boleh dipanggil dari internet
    location /internal/ {
        return 404;
    }

    # services-node: worklist lab, dashboard, laporan
    location /node/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}

# Yii khusus jaringan lokal. Dipakai services-node untuk PUT /internal/lab-items/{id}/result
# (YII_BASE_URL=http://127.0.0.1:8080). Tidak bisa diakses dari luar server.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __APP_DIR__/backend-yii/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 60s;
    }
}
